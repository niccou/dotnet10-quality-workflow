repos:
  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format
        entry: dotnet format --verify-no-changes --verbosity diagnostic
        language: system
        files: \.cs$
        pass_filenames: false
      - id: dotnet-test
        name: dotnet test
        entry: dotnet test --no-restore --verbosity normal
        language: system
        pass_filenames: false
        stages: [commit]
